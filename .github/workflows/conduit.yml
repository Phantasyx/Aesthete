name: conduit

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node conduit/test/rules.test.js
      - run: node conduit/scripts/build.mjs
      - run: git diff --exit-code -- conduit/dist
